/* ---------- computation ---------- */
function pooled(cohorts) {
  // life table over the given cohorts; index k = Fachsemester (1..11)
  const out = { h: {}, share: {}, before: {}, risk: {}, left: {}, n: {}, still: null };
  let S = 1, ok = true;
  for (const k of KS) {
    const use = cohorts.filter(N => N[k] != null);
    const a = use.reduce((s, N) => s + N[k-1], 0), b = use.reduce((s, N) => s + N[k], 0);
    if (!ok || !use.length || a === 0) { ok = false; continue; }
    const h = (a - b) / a;
    out.h[k] = h; out.share[k] = S * h; out.before[k] = S; out.risk[k] = a; out.left[k] = a - b; out.n[k] = use.length;
    S *= 1 - h;
  }
  if (ok) out.still = S;
  return out;
}
const isDrop = k => k <= 5;
function cellValue(N, k, measure, mode) {
  // one cohort, one Fachsemester; null = not observed
  if (N[k] == null) return null;
  if (mode === 'cum') {
    if (!isDrop(k) && N[5] == null) return null;
    const lost = isDrop(k) ? N[0] - N[k] : N[5] - N[k];
    return measure === 'cnt' ? lost : lost / N[0];
  }
  const left = N[k-1] - N[k];
  if (measure === 'cnt') return left;
  return measure === 'haz' ? (N[k-1] ? left / N[k-1] : null) : left / N[0];
}
function pooledValue(P, k, measure, mode, cohorts) {
  if (measure === 'cnt') {
    const use = cohorts.filter(N => cellValue(N, k, 'cnt', mode) != null);
    return use.length ? use.reduce((s, N) => s + cellValue(N, k, 'cnt', mode), 0) : null;
  }
  if (P.share[k] == null) return null;
  if (mode === 'cum') {
    let s = 0;
    for (let j = isDrop(k) ? 1 : 6; j <= k; j++) s += P.share[j];
    return s;
  }
  return measure === 'haz' ? P.h[k] : P.share[k];
}

  const pe = pool[pool.length - 1]; labels.push({ k: pe.k, y: y(pe.v), t: pct(pe.v), cls: 'strong' });
  const byK = {}; labels.forEach(l => (byK[l.k] = byK[l.k] || []).push(l));
  Object.values(byK).forEach(g => { g.sort((a, b) => a.y - b.y); for (let i = 1; i < g.length; i++) if (g[i].y - g[i-1].y < 13) g[i].y = g[i-1].y + 13; });
  labels.forEach(l => { s += `<text class="${l.cls || 'v'}" x="${x(l.k) + 8}" y="${l.y + 4}">${l.t}</text>`; });
  s += `<rect id="hitB" x="${L - 10}" y="${TOP - 10}" width="${W - L - R + 20}" height="${H - TOP - B + 20}" fill="transparent"/><circle id="hoverB" r="6" fill="none" stroke="var(--ink)" stroke-width="1.5" visibility="hidden"/>`;
  box.innerHTML = s + '</svg>';
  const svg = box.querySelector('svg'), hov = box.querySelector('#hoverB');
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width, py = (e.clientY - r.top) * H / r.height;
    let best = null, bd = 1e9; points.forEach(p => { const d = (p.x - px) ** 2 + (p.y - py) ** 2; if (d < bd) { bd = d; best = p; } });
    if (!best || bd > 60 * 60) { hov.setAttribute('visibility', 'hidden'); hideTip(); return; }
    hov.setAttribute('cx', best.x); hov.setAttribute('cy', best.y); hov.setAttribute('visibility', 'visible'); showTip(best.html, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', () => { hov.setAttribute('visibility', 'hidden'); hideTip(); });
}

function renderTable(cur, P) {
  const m = state.measure, mode = state.mode, tbl = document.getElementById('pivot');
  document.getElementById('tDesc').textContent = T.t_desc[mode];
  if (!cur.cohorts.length) { tbl.innerHTML = `<tbody><tr><td class="na">${T.empty}</td></tr></tbody>`; return; }
  const fmt = v => m === 'cnt' ? String(v) : pct(v);
  const rows = cur.cohorts.map(N => KS.map(k => cellValue(N, k, m, mode)));
  const prow = KS.map(k => pooledValue(P, k, m, mode, cur.cohorts));
  const ratioMax = Math.max(0.0001, ...rows.flat().concat(m === 'cnt' ? [] : prow).filter(v => v != null));
  const shade = (v, k, max) => v == null || v <= 0 ? '' : `background:color-mix(in oklab, var(--${isDrop(k) ? 'drop' : 'grad'}) ${(6 + 44 * Math.min(1, v / max)).toFixed(0)}%, var(--surface))`;
  let h = `<thead><tr><th></th><th></th><th class="grp d" colspan="5">${T.th_d}</th><th class="grp g" colspan="6">${T.th_g}</th><th></th></tr>`;
  h += `<tr><th style="text-align:left">${T.th_cohort}</th><th>${T.th_n}</th>${KS.map(k => `<th>${k}</th>`).join('')}<th>${T.th_still}</th></tr></thead><tbody>`;
  cur.names.forEach((c, i) => {
    const N = cur.cohorts[i];
    h += `<tr><th scope="row">${label(c)}</th><td class="n">${N[0]}</td>`;
    KS.forEach((k, j) => {
      const v = rows[i][j];
      if (v == null) { h += '<td class="na">—</td>'; return; }
      const left = N[k-1] - N[k];
      let tipHtml = `<b>${T.tip_cohort(label(c))}</b> · ${mode === 'cum' ? T.tip_upto(k) : T.tip_after(k)}<br>`;
      if (mode === 'cum') { const lost = isDrop(k) ? N[0] - N[k] : N[5] - N[k]; tipHtml += `${isDrop(k) ? T.tip_cumD(lost, N[0]) : T.tip_cumG(lost, N[0])}<br>${T.tip_shareEnt(pct(lost / N[0]))}`; }
      else tipHtml += `${T.tip_left(left, N[k-1], N[k])}<br>${T.tip_shareEnt(pct(left / N[0]))}<br>${T.tip_shareHaz(pct(left / N[k-1]))}`;
      const thin = m === 'haz' && N[k-1] < 10;
      h += `<td class="cell${thin ? ' thin' : ''}" style="${shade(v, k, ratioMax)}" data-tip="${attr(tipHtml)}">${fmt(v)}${v < 0 ? ' †' : ''}</td>`;
    });
    const still = N[11];
    h += (still == null ? '<td class="na">—</td>' : `<td class="n">${m === 'cnt' ? still : pct(still / N[0])}</td>`) + '</tr>';
  });
  const nEntry = cur.cohorts.reduce((s, N) => s + N[0], 0);
  h += `<tr class="pool"><th scope="row">${m === 'cnt' ? T.sum : T.pool}</th><td class="n">${nEntry}</td>`;
  const poolMax = m === 'cnt' ? Math.max(1, ...prow.filter(v => v != null)) : ratioMax;
  KS.forEach((k, j) => {
    const v = prow[j];
    if (v == null) { h += '<td class="na">—</td>'; return; }
    const tipHtml = `<b>${m === 'cnt' ? T.sum : T.pool}</b> · ${mode === 'cum' ? T.tip_upto(k) : T.tip_after(k)}<br>${fmt(v)}` + (P.n[k] ? `<br><span class="dim">${T.tip_cohorts(P.n[k], P.risk[k])}</span>` : '');
    h += `<td class="cell" style="${shade(v, k, poolMax)}" data-tip="${attr(tipHtml)}">${fmt(v)}${v < 0 ? ' †' : ''}</td>`;
  });
  const stillN = cur.cohorts.filter(N => N[11] != null).reduce((s, N) => s + N[11], 0);
  h += (m === 'cnt' ? `<td class="n">${stillN}</td>` : (P.still == null ? '<td class="na">—</td>' : `<td class="n">${pct(P.still)}</td>`)) + '</tr></tbody>';
  tbl.innerHTML = h; bindTips(tbl);
}

/* ---------- boot ---------- */
buildControls();
render();
let raf = 0;
new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { const cur = current(), P = pooled(cur.cohorts); renderChartA(cur, P); renderChartB(cur, P); }); }).observe(document.querySelector('.wrap'));
</script>
</body>
